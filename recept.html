<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Recept på pannkakor</title>
		<link rel="stylesheet" href="./styles/_reset.css" />
		<link rel="stylesheet" href="./styles/_layout.css" />
		<link rel="stylesheet" href="./styles/globals.css" />
		<link rel="stylesheet" href="./styles/recept.css" />
	</head>
	<body>
		<header class="header-main">
			<!-- Navigation menu -->
			<nav>
				<ul class="header-main__nav">
					<li>
						<a href="/index.html">
							<!-- Logo image, redirects to home page -->
							<figure class="header-main__logo-figure">
								<img
									src="/images/Official_CSS_Logo.png"
									width="100%"
									alt="CSS Logo"
								/>
							</figure>
						</a>
					</li>
					<li><a href="/recept.html">Recept</a></li>
					<li><a href="/about.html">Om oss</a></li>
					<li><a href="/kontakt.html">Kontakt</a></li>
					<li class="header-main__nav-login-link">
						<a href="#">Logga in</a>
					</li>
				</ul>
			</nav>
		</header>
		<main>
			<content class="content-container">
				<section role="contentinfo" aria-label="recept">
					<header class="recipes-list-header">
						<h1 class="recipes-list-header__title">Recept</h1>
					</header>
					<section
						class="recipes-grid"
						id="recipes-grid"
						role="contentinfo"
						aria-label="recept lista"
					></section>
				</section>
			</content>
		</main>
		<script>
			const recipes = [
				{
					title: "Enkelt recept på pannkakor",
					page: "index",
					imgName: "pannkakor_sylt_och_gradde",
					imgDescription: "Tunna traditionella pannkakor med sylt och grädde",
					description:
						"Gör traditionella tunna pannkakor med detta enkla och goda pannkaksrecept.",
				},
				{
					title: "Enkelt recept på pannkakor",
					page: "index",
					imgName: "pannkakor_sylt_och_gradde",
					imgDescription: "Tunna traditionella pannkakor med sylt och grädde",
					description:
						"Gör traditionella tunna pannkakor med detta enkla och goda pannkaksrecept.",
				},
				{
					title: "Enkelt recept på pannkakor",
					page: "index",
					imgName: "pannkakor_sylt_och_gradde",
					imgDescription: "Tunna traditionella pannkakor med sylt och grädde",
					description:
						"Gör traditionella tunna pannkakor med detta enkla och goda pannkaksrecept.",
				},
				{
					title: "Enkelt recept på pannkakor",
					page: "index",
					imgName: "pannkakor_sylt_och_gradde",
					imgDescription: "Tunna traditionella pannkakor med sylt och grädde",
					description:
						"Gör traditionella tunna pannkakor med detta enkla och goda pannkaksrecept.",
				},
			];
			const recipeListItem = document.getElementById("recipes-grid");
			recipes.forEach((recipe) => {
				const article = document.createElement("article");
				article.className = "recipe-list-item";
				article.id = "recipe-list-item";

				const imgLink = document.createElement("a");
				imgLink.href = `/${recipe.page}.html`;

				const figure = document.createElement("figure");
				figure.className = "recipe-list-item__figure";

				const img = document.createElement("img");
				img.src = `./images/${recipe.imgName}.jpg`;
				img.style.width = "100%";
				img.alt = recipe.imgDescription;

				article.append(imgLink);
				imgLink.append(figure);
				figure.append(img);

				const title = document.createElement("h2");
				const titleLink = document.createElement("a");
				titleLink.href = `/${recipe.page}.html`;
				titleLink.innerText = recipe.title;
				const description = document.createElement("p");
				description.innerHTML = recipe.description;

				title.appendChild(titleLink);
				article.append(title);
				article.append(description);

				recipeListItem.append(article);
			});
		</script>
	</body>
</html>
