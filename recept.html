<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Pannkakor recept</title>
		<link rel="stylesheet" href="./styles/_reset.css" />
		<link rel="stylesheet" href="./styles/_layout.css" />
		<link rel="stylesheet" href="./styles/recept.css" />
	</head>
	<body>
		<header class="header-main">
			<!-- Navigation menu -->
			<nav>
				<ul class="header-main__nav">
					<li>
						<a href="/index.html">
							<!-- Logo image, redirects to home page -->
							<figure class="header-main__logo-figure">
								<img
									src="/images/Official_CSS_Logo.png"
									width="100%"
									alt="CSS Logo"
								/>
							</figure>
						</a>
					</li>
					<li><a href="/recept.html">Recept</a></li>
					<li><a href="/about.html">Om oss</a></li>
					<li><a href="/kontakt.html">Kontakt</a></li>
					<li class="header-main__nav-login-link">
						<a href="#">Logga in</a>
					</li>
				</ul>
			</nav>
		</header>
		<main>
			<content class="content-container-outer">
				<div class="content-container">
					<section
						class="recipes-list"
						role="contentinfo"
						aria-label="recipe instructions"
					>
						<header class="recipes-list-header">
							<h1 class="recipes-list-header__title">Recept</h1>
						</header>
						<section
							class="recipes-grid"
							role="contentinfo"
							aria-label="recipes list"
						>
							<div
								class="recipe-list-item"
								role="contentinfo"
								aria-label="recipe with description and image"
							>
								<a href="/index.html">
									<figure class="recipe-list-item__figure">
										<img
											src="./images/pannkakor_sylt_och_gradde.jpg"
											width="100%"
											alt="Tunna traditionella pannkakor med sylt och grädde"
										/>
									</figure>
								</a>

								<h2><a href="/index.html">Enkelt recept på pannkakor </a></h2>
								<p>
									Gör traditionella tunna pannkakor med detta enkla och goda
									pannkaksrecept.
								</p>
							</div>
						</section>
					</section>
				</div>
			</content>
		</main>
	</body>
</html>
