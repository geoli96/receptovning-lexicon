<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Skicka in ditt recept</title>
		<link rel="stylesheet" href="./styles/_reset.css" />
		<link rel="stylesheet" href="./styles/_layout.css" />
		<link rel="stylesheet" href="./styles/globals.css" />
		<link rel="stylesheet" href="./styles/skicka-in-recept.css" />
	</head>
	<body>
		<header class="header-main">
			<!-- Navigation menu -->
			<nav>
				<ul class="header-main__nav">
					<li>
				<a href="/index.html">
							<!-- Logo image, redirects to home page -->
							<figure class="header-main__logo-figure">
								<img
									src="/images/Official_CSS_Logo.png"
									width="100%"
									alt="CSS Logo"
								/>
							</figure>
						</a>
					</li>
					<li class="header-main__nav-submenu">
						<ul>
							<li><a href="/recept.html">Recept</a></li>
							<li>
								<a href="/skicka-in-recept.html">Skicka in ditt recept</a>
							</li>
							<li><a href="/about.html">Om oss</a></li>
							<li><a href="/kontakt.html">Kontakt</a></li>
						</ul>
					</li>
					<li class="header-main__submenu-responsive-list-item">
						<a href="/recept.html">Recept</a>
					</li>
					<li class="header-main__submenu-responsive-list-item">
						<a href="/skicka-in-recept.html">Skicka in ditt recept</a>
					</li>
					<li class="header-main__submenu-responsive-list-item">
						<a href="/about.html">Om oss</a>
					</li>
					<li class="header-main__submenu-responsive-list-item">
						<a href="/kontakt.html">Kontakt</a>
					</li>
					<li class="header-main__nav-login-link">
						<a href="#">Logga in</a>
					</li>
				</ul>
			</nav>
		</header>
		<main>
			<content class="content-container">
				<section role="contentinfo">
					<header class="upload-recipe-header">
						<h1 class="upload-recipe-header__title">Skicka in ditt recept</h1>
					</header>
					<section role="contentinfo" aria-label="skicka in recept formulär">
						<form
							id="upload-recipe-form"
							class="upload-recipe-form"
							method="post"
						>
							<p>
								<label for="author_name">Ditt namn:</label>
								<input
									type="text"
									id="author_name"
									name="author_name"
									autocomplete="name"
									required
								/>
							</p>
							<p>
								<label for="recipe_name">Recept titel:</label>
								<input
									type="text"
									id="recipe_name"
									name="recipe_name"
									required
								/>
							</p>
							<p>
								<label for="recipe_description">Beskrivning:</label>
								<textarea
									required
									id="recipe_description"
									name="recipe_description"
									maxlength="1000"
								></textarea>
							</p>
							<p>
								<label for="recipe_type">Typ av recept:</label>
								<select name="recipe_type" id="recipe_type" required>
									<option value="frukost">Frukost</option>
									<option value="fika">Mellanmål</option>
									<option value="fika">Fika</option>
									<option value="lunch">Lunch</option>
									<option value="middag">Middag</option>
									<option value="efterrätt">Efterrätt</option>
								</select>
							</p>
							<p>
								<label for="nr_portions">Antal portioner:</label>
								<input
									type="number"
									id="nr_portions"
									name="nr_portions"
									min="1"
									max="20"
									inputmode="numeric"
									required
								/>
							</p>
							<p>
								<label for="ingredients">Ingredienser:</label>
								<textarea
									required
									id="ingredients"
									name="ingredients"
									maxlength="2000"
								></textarea>
							</p>
							<p>
								<label for="instructions">Instruktioner:</label>
								<textarea
									required
									id="instructions"
									name="instructions"
									maxlength="4000"
								></textarea>
							</p>
							<p>
								<button class="upload-recipe-form__submit-button" type="submit">
									Skicka in recept
								</button>
							</p>
						</form>
					</section>
				</section>
			</content>
		</main>
		<script>
			const form = document.getElementById("upload-recipe-form");
			form.addEventListener("submit", (event) => {
				event.preventDefault();
				const formData = new FormData(event.target);
				const formObject = Object.fromEntries(formData.entries());
				localStorage.setItem(
					`${formObject.author_name}-${formObject.recipe_name}`,
					JSON.stringify(formObject),
				);
				alert(`Recept inskickat!`);
				form.reset();
			});
		</script>
	</body>
</html>
